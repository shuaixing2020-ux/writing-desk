name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22 是最低支持版本（node:sqlite 从 22.6 起可用），24 是开发版本
        node: ['22', '24']
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建前端
        run: npm run build

      - name: 集成自检
        # 真实启动服务并跑 28 项 HTTP 检查（含稿件安全、导出、路径穿越防护）。
        # 自检内部用临时数据目录，不会碰到仓库里的 data/。
        run: npm run selfcheck

  e2e:
    name: 端到端（真实浏览器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 构建前端
        run: npm run build

      - name: 端到端测试
        run: npm run test:e2e
